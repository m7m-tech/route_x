name: route_x
description: "A new Flutter project."
version: 1.0.0+1
environment:
  sdk: ^3.9.0

dependencies:
  # 🚨 CRITICAL: Required for every Flutter project - DO NOT REMOVE
  flutter: 
    sdk: flutter 

  # Localization support for multi-language apps
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # -----------------------------------
  # UI & Design
  # -----------------------------------
  
  # Render SVG vector graphics
  flutter_svg: ^2.0.12
  
  # Cache network images for performance optimization
  cached_network_image: ^3.4.1
  
  # Apply gradient borders to widgets and containers
  gradient_borders: ^1.0.2

  # -----------------------------------
  # State Management
  # -----------------------------------
  
  # Manage app state using the Bloc / Cubit pattern
  flutter_bloc: ^8.1.6
  
  # Compare objects efficiently to prevent unnecessary UI rebuilds
  equatable: ^2.0.5

  # -----------------------------------
  # Core & Services
  # -----------------------------------
  
  # Lightweight local storage for preferences and tokens
  shared_preferences: ^2.3.3
  
  # Check network connectivity status (Wi-Fi or cellular data)
  connectivity_plus: ^6.1.0

  # Clean Architecture Core Tools
  get_it: ^7.7.0
  dartz: ^0.10.1

  # Responsive Design & UI Utilities
  flutter_screenutil: ^5.9.3
  image_picker: ^1.2.3
  pinput: ^6.0.2
  google_fonts: ^8.2.1
  country_flags: ^4.1.2
  lottie: ^3.1.3
  
  # Networking & Secure Storage
  dio: ^5.11.1
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  # 🚨 CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_test:    
    sdk: flutter    
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.14.4

flutter:
  # 🚨 CRITICAL: Required for Material icon font - DO NOT REMOVE
  uses-material-design: true
  generate: true
  
  assets:
    # --- Animations ---
    - assets/animations/
    # --- Images ---
    - assets/images/svg/
    - assets/images/png/
    - assets/images/jpg/
    # --- Icons ---
    - assets/icons/svg/
    - assets/icons/png/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Light.otf
          weight: 100
        - asset: assets/fonts/Satoshi/Satoshi-Light.otf
          weight: 200
        - asset: assets/fonts/Satoshi/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi/Satoshi-Medium.otf
          weight: 600
        - asset: assets/fonts/Satoshi/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi/Satoshi-Bold.otf
          weight: 800
        - asset: assets/fonts/Satoshi/Satoshi-Black.otf
          weight: 900

  # 🚨 CRITICAL FONTS RULE:
  # - DO NOT ADD NEW LOCAL FONTS TO assets/fonts/
  # - ONLY USE EXISTING LOCAL FONTS FROM assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/png/logo.png"